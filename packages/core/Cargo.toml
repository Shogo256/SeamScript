[package]
name = "seamscript-core"
version = "0.0.0"
edition = "2024"
description = "Grapheme segmentation and normalization for SeamScript's Text, shared by the browser (WASM) and native backends"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Exact versions: both must implement the same Unicode version, which is what
# makes "one character" mean the same thing in the browser and on a backend.
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
