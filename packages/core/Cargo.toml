[package]
name = "seamscript-core"
version = "0.0.0"
edition = "2024"
description = "Grapheme segmentation and normalization for SeamScript's Text, shared by the browser (WASM) and native backends"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# An exact version: its Unicode version must match src/gcb_table.rs (checked at
# compile time), which is what makes "one character" mean the same thing in the
# browser and on a backend.
unicode-normalization = "=0.1.25"

[dev-dependencies]
# The reference that src/segment.rs is tested against, at the same Unicode version.
unicode-segmentation = "=1.13.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# props.rs's tests classify all 1.1M code points; unoptimized, that takes minutes.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
