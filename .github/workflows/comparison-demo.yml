# The comparison demo: the same screen written in TypeScript strict + Zod +
# ESLint and in SeamScript, with three bugs. Each side's tests ask whether each
# bug is stopped before it reaches a user. On the TypeScript side they are
# expected to fail, so that job passes when they do; the SeamScript job passes
# when they pass. A third job runs `yarn demo`, which checks the exact split
# (every TypeScript test failed, every SeamScript test passed).
name: Comparison demo

on:
  push:
  pull_request:

jobs:
  ts-zod-eslint:
    name: TypeScript strict + Zod + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - name: tsc --strict and ESLint (recommended) pass
        run: yarn workspace @seamscript-demo/ts-zod-eslint lint
      - name: The three bugs get through (the tests are expected to fail)
        run: "! yarn workspace @seamscript-demo/ts-zod-eslint test"

  seamscript:
    name: SeamScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g yarn@1.22.22
      - run: rustup target add wasm32-unknown-unknown
      - run: yarn install --frozen-lockfile
      - name: Build runtime, WASM core, parser and compiler
        run: yarn build
      - name: Are the three bugs stopped?
        run: yarn workspace @seamscript-demo/seamscript test

  expected-split:
    name: Demo still shows the expected split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g yarn@1.22.22
      - run: rustup target add wasm32-unknown-unknown
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn demo
